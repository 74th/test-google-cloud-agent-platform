apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-default-deny-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: test
      component: isolated-claude-agent
  policyTypes:
    - Egress
  egress:
    # kube-dns is the only in-cluster service needed by the workload.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # GKE Dataplane V2 metadata server used by Workload Identity Federation.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
