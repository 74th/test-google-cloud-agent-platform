[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gke-session-sandbox"
version = "0.1.0"
description = "Session-scoped GKE Agent Sandbox lifecycle and runtime client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.14,<4",
  "grpcio>=1.78.0",
  "kubernetes-asyncio>=35,<36",
  "protobuf>=6.31.1,<7",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
gke-session-sandbox = "gke_session_sandbox.cli:main"

[dependency-groups]
dev = [
  "grpcio-tools==1.78.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
markers = [
  "gke: requires access to an explicitly selected GKE validation cluster",
]
