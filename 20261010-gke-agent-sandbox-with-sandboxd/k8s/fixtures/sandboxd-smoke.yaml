apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: sandboxd-smoke
  namespace: session-sandboxes
  labels:
    app.kubernetes.io/part-of: gke-session-sandbox
    app.kubernetes.io/component: smoke-test
spec:
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: gke-session-sandbox
        app.kubernetes.io/component: smoke-test
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sandboxd
          image: ${SANDBOXD_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /v1/health
              port: rest
          volumeMounts:
            - name: workspace
              mountPath: /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace
        labels:
          app.kubernetes.io/part-of: gke-session-sandbox
          app.kubernetes.io/component: smoke-test
      spec:
        storageClassName: session-workspace-rwo
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
