[project]
name = "20260801-agent-hosting"
version = "0.1.0"
description = "Claude Agent SDK bus timetable agent for Google Cloud Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_service*", "scripts*"]

[project.optional-dependencies]
client = []
deploy = ["google-cloud-aiplatform>=1.144.0"]
test = ["httpx>=0.27.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
